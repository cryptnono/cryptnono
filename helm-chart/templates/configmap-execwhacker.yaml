{{- if .Values.detectors.execwhacker.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cryptnono.fullname" . }}-execwhacker
  labels:
    {{- include "cryptnono.labels" . | nindent 4 }}
data:
  execwhacker_config.json: |
    {{- .Values.detectors.execwhacker.config | mustToPrettyJson | nindent 4 }}
  {{- range $key, $value := .Values.detectors.execwhacker.configs }}
  execwhacker-{{ $key }}.json: |
    {{- $value | toJson | nindent 4 }}
  {{ end }}
{{- end }}
